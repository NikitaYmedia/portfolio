<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin – Reviews</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/reviews.css">
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="container header__inner">
            <a class="brand" href="index.html">
                <span class="brand__name">Nikita Yeltsov</span>
                <span class="brand__role">Design Engineer</span>
            </a>
            <span></span>
            <div class="header__actions">
                <a class="button button--outline button--small" href="index.html"><span class="icon icon--arrow-left" aria-hidden="true"></span><span>Back to site</span></a>
            </div>
        </div>
    </header>
    <main class="admin">
        <h1>Reviews admin</h1>
        <p id="notice" class="form-error" hidden></p>

        <form id="login" class="admin-login" hidden>
            <div class="field">
                <label class="field__label" for="email">Email</label>
                <input class="input" id="email" type="email" autocomplete="username" required>
            </div>
            <div class="field">
                <label class="field__label" for="password">Password</label>
                <input class="input" id="password" type="password" autocomplete="current-password" required>
            </div>
            <p id="login-error" class="form-error" role="alert" hidden></p>
            <button class="button button--primary" type="submit"><span>Log in</span></button>
        </form>

        <section id="panel" hidden>
            <div class="admin-bar"><span id="count"></span><button class="button button--outline button--small" id="logout" type="button"><span>Log out</span></button></div>
            <ul class="reviews" id="admin-list"></ul>
        </section>
    </main>
</body>

</html>
